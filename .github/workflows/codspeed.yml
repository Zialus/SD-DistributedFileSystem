name: CodSpeed Benchmarks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benchmarks:
    name: Run benchmarks
    # codspeed-macro runners are only available for organization repositories
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to check out the repository.
      id-token: write  # Required for OIDC authentication with CodSpeed.
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the CodSpeed JMH fork
        run: |
          git submodule update --init --depth 1 -- third-party/codspeed-jvm
          git -C third-party/codspeed-jvm submodule update --init --depth 1 -- \
            jmh-fork/jmh-core/native-instrument-hooks/instrument-hooks

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: "9.8.2"

      - name: Build the benchmarks
        run: gradle jmhJar

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c  # v5.6.1
        with:
          mode: walltime
          run: gradle jmh
