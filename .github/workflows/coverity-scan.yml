name: Coverity Scan
on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily_scan:
    name: Daily Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.7.1"

      - name: Download Coverity Build Tool
        env:
          TOKEN: ${{ secrets.COVERITY_TOKEN }}
        run: |
          wget -q "https://scan.coverity.com/download/java/linux64" \
            --post-data "token=${TOKEN}&project=Zialus%2FSD-DistributedFileSystem" \
            -O cov-analysis-linux64.tar.gz
          mkdir cov-analysis-linux64
          tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64

      - name: Build with cov-build
        run: |
          export PATH=`pwd`/cov-analysis-linux64/bin:$PATH
          cov-build --dir cov-int gradle build --no-daemon

      - name: Submit the result to Coverity Scan
        run: |
          tar czvf snake.tgz cov-int
          curl \
          --form token=$TOKEN \
          --form email=raulmendesferreira@gmail.com \
          --form file=@snake.tgz \
          --form version="trunk" \
          --form description="SD-DistributedFileSystem" \
          https://scan.coverity.com/builds?project=Zialus%2FSD-DistributedFileSystem
        env:
          TOKEN: ${{ secrets.COVERITY_TOKEN }}
