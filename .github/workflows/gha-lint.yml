name: 🔍 GHA Linter

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Validate GitHub Actions and YAML
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to read repository contents.
      checks: write  # Required to publish check annotations from the lint tools.
      pull-requests: write  # Required to leave review comments on pull requests.
      actions: read  # Required to inspect workflow and action metadata.
      security-events: write  # Required to upload the Zizmor SARIF report.
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Run actionlint
        uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5  # v1.80.2
        with:
          reporter: github-pr-review

      - name: 🧪 Run yamllint
        uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060  # v1.25.2
        with:
          reporter: github-pr-review
          yamllint_flags: .github

      - name: 📝 Run markdownlint
        uses: reviewdog/action-markdownlint@b85a623ec721cb42896c485633f527cbd2d58063  # v0.31.5
        with:
          reporter: github-pr-review
          markdownlint_flags: "**/*.md"

      - name: 🛡️ Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          inputs: .github
          persona: pedantic
          advanced-security: false
          annotations: true
