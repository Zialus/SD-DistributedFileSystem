name: 🔍 GHA Linter

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Validate GitHub Actions and YAML
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to read repository contents.
      checks: write  # Required to publish check annotations from the lint tools.
      pull-requests: write  # Required to leave review comments on pull requests.
      actions: read  # Required to inspect workflow and action metadata.
      security-events: write  # Required to upload the Zizmor SARIF report.
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Run actionlint
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f  # v1.80.6
        with:
          reporter: github-pr-review

      - name: 🧪 Run yamllint
        uses: reviewdog/action-yamllint@8f84f0fb670d777d3e584ef50faf60eb61605b2a  # v1.25.3
        with:
          reporter: github-pr-review
          yamllint_flags: .github

      - name: 📝 Run markdownlint
        uses: reviewdog/action-markdownlint@0f00f9816d25b024975712a1ad4ea03dbf5848a6  # v0.31.7
        with:
          reporter: github-pr-review
          markdownlint_flags: "**/*.md"

      - name: 🛡️ Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          inputs: .github
          persona: pedantic
          advanced-security: false
          annotations: true
