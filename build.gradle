plugins {
    id 'info.solidsoft.pitest' version '1.19.0'
    id "se.patrikerdes.use-latest-versions" version "0.2.19"
    id "io.github.ben-manes.versions" version "0.61.0"
    id "net.ltgt.errorprone" version "5.1.0"
    id "com.github.spotbugs" version "6.5.10"
    id "pmd"
    id 'checkstyle'
    id "java"
    id "idea"
    id 'jacoco'
    id "org.sonarqube" version "7.4.0.8496"
    id "io.freefair.lombok" version "9.5.0"
    id "nebula.lint" version "21.2.1"
}

sonarqube {
    properties {
        property "sonar.projectKey", "Zialus_SD-DistributedFileSystem"
        property "sonar.organization", "zialus-github"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

group = 'fcup'
version = '1.0-SNAPSHOT'

Boolean enableErrorProne = System.properties['enableErrorProne']
println "[IMPORTANT INFORMATION] ErrorProne is ${enableErrorProne ? 'enabled' : 'disabled'}"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:6.1.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.1.3')

    implementation('org.jline:jline:4.3.1')

    spotbugsPlugins('com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0')
    spotbugsPlugins('com.mebigfatguy.sb-contrib:sb-contrib:7.7.4')

    annotationProcessor('com.uber.nullaway:nullaway:0.13.8')
    errorprone('com.google.errorprone:error_prone_core:2.50.0')
    errorprone('tech.picnic.error-prone-support:error-prone-contrib:0.30.0')
    errorprone('tech.picnic.error-prone-support:refaster-runner:0.30.0')
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.enabled = enableErrorProne ?: false
    options.errorprone {
        option("NullAway:AnnotatedPackages", "fcup")
    }
    options.compilerArgs += ['-Xlint:all']
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }

    reports {
        html.required = true
    }
}

// Don't produce default Jar
jar.enabled = false

def jarPackage(String groupName, String artifactName, String artifactVersion) {
    return tasks.create("jar_${artifactName}", Jar) {
        getArchiveBaseName().set(artifactName)
        getArchiveVersion().set(artifactVersion)

        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

        from(sourceSets.main.output) {
            include "$groupName/**"
        }

        manifest {
            attributes(
                    'Main-Class': "$groupName.$artifactName"
            )
        }

    }
}

def storageServerJar = jarPackage("$group", "StorageServer", "$version")
def clientJar = jarPackage("$group", "Client", "$version")
def metadataServerJar = jarPackage("$group", "MetadataServer", "$version")

assemble.dependsOn storageServerJar, clientJar, metadataServerJar

pmd {
    toolVersion = '7.26.0'
    ignoreFailures = true
}

pmdMain {
    reports {
        xml.required = false
        html.required = true
    }
}

pmdTest {
    reports {
        xml.required = false
        html.required = true
    }
}

pitest {
    junit5PluginVersion = '1.2.3'
    pitestVersion = '1.25.9'
    mutators = ["ALL"]
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

lombok {
    version = '1.18.46'
}

spotbugs {
    toolVersion = '4.10.3'
    ignoreFailures = true
    showStackTraces = false
    showProgress = true
}

spotbugsMain {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugsTest {
    reports {
        xml.required = false
        html.required = true
    }
}

checkstyle {
    toolVersion = '13.11.0'
    showViolations = false
    ignoreFailures = true
}

checkstyleMain {
    reports {
        xml.required = false
        html.required = true
    }
}

checkstyleTest {
    reports {
        xml.required = false
        html.required = true
    }
}
